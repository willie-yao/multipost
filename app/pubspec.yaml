name: cross_posting_app
description: Multipost (working name), a human-operated personal posting app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  at_primitives: 1.2.0
  atproto_oauth: 0.8.3
  atproto_core: 2.4.1
  bluesky: 2.18.0
  bluesky_text: 1.8.0
  characters: ^1.4.1
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_appauth: 13.0.0
  flutter_secure_storage: 11.2.0
  flutter_web_auth_2: 5.1.0
  freezed_annotation: ^3.1.0
  http: ^1.6.0
  image: ^4.13.1
  image_picker: ^1.2.4
  json_annotation: ^4.12.0
  material_ui: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.6
  uuid: ^4.6.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  fonts:
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext.ttf
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf
