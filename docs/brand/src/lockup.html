<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Rubik;src:url("../../../app/assets/fonts/Rubik.ttf");font-weight:300 900}
@font-face{font-family:Atk;src:url("../../../app/assets/fonts/AtkinsonHyperlegibleNext.ttf");font-weight:200 800}
html,body{margin:0}
body{width:720px;height:240px;display:flex;flex-direction:column;justify-content:center;padding:0 48px;box-sizing:border-box;background:var(--g);color:var(--t)}
body.light{--g:#F2F3F0;--t:#16171A;--s:#4B5058} body.dark{--g:#121315;--t:#F1F2EE;--s:#B4B9BF}
.l{display:flex;align-items:center;gap:22px} .w{font:700 64px Rubik;letter-spacing:-1px}
.tag{font:400 26px Atk;color:var(--s);margin-top:16px}
svg{border-radius:20px}
</style></head><body class="light">
<div class="l"><svg viewBox="0 0 108 108" width="92" height="92"><rect width="108" height="108" fill="#2B3BC9"/><path d="M48.5 38.5 L42.5 59.5 M65.5 38.5 L59.5 59.5" stroke="#fff" stroke-width="10" stroke-linecap="round"/><rect x="35" y="67.5" width="38" height="7" rx="3.5" fill="#fff"/></svg><span class="w">Multipost</span></div>
<div class="tag">Write once. Share your way.</div>
<script>if(location.hash==='#dark')document.body.className='dark'</script>
</body></html>
