name: Publish Bluesky sign-in metadata

# Serves docs/bluesky/pages at https://willie-yao.github.io/multipost/.
# The app's tests check that client-metadata.json matches what the app
# requires, so this folder is the single source of truth.
on:
  push:
    branches: [main]
    paths:
      - docs/bluesky/pages/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/bluesky/pages
      - id: deployment
        uses: actions/deploy-pages@v4
